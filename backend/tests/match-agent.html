/* Decision explanations: compact, accessible accordions (Enhanced & Benchmark only).
   Backend may supply reasoning as a string or an array of separate reasons. */
.reason-accordion{margin-top:15px;border:1px solid #72efd03b;border-radius:12px;background:linear-gradient(120deg,#6bf0cc0d,#899aff07);min-width:0;overflow:hidden}
.reason-accordion summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;list-style:none;cursor:pointer;user-select:none;color:#a9f6e2;transition:background .2s}
.reason-accordion summary::-webkit-details-marker{display:none}
.reason-accordion summary:hover{background:#70eacc0b}
.reason-accordion summary:focus-visible{outline:2px solid var(--mint);outline-offset:-3px;border-radius:10px}
.reason-toggle-copy,.reason-toggle-right{display:inline-flex;align-items:center;gap:7px;min-width:0}
.reason-toggle-copy>svg{flex:none}
.reason-toggle-label{font-size:11px;letter-spacing:.025em;font-weight:900}
.reason-toggle-status{font-size:9px;color:#b4c5d8;text-transform:uppercase;font-weight:800;letter-spacing:.04em;white-space:normal}
.reason-toggle-status:before{content:'·';margin-right:7px;color:#7786a4}
.reason-toggle-right{flex:0 0 auto;color:#8196b2;font-size:10px;font-weight:800}
.reason-chevron{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s;margin:-4px 3px 0 7px}
.reason-accordion[open] .reason-chevron{transform:rotate(225deg);margin:4px 3px 0 7px}
.reason-panel{border-top:1px solid var(--line);padding:12px 15px 13px;color:#dbe8fa;font-size:12px;line-height:1.6;overflow-wrap:anywhere}
.reason-list{margin:0;padding-left:19px;display:grid;gap:9px}
.reason-list li{padding-left:1px}
.reason-list li::marker{color:var(--mint)}
.reason-empty{margin:0;color:#e4cba9}
.reason-accordion--missing{border-color:#ffcc8636;background:#ffcc8607}
.reason-accordion--missing summary{color:#ffcc86}
.reason-accordion--benchmark{grid-column:1/-1;margin-top:4px}
.reason-accordion--benchmark summary{padding:9px 11px}
.reason-accordion--benchmark .reason-panel{font-size:11px}
.reason-accordion--profile{margin:16px 0 0}
/* Equal-height label rows keep Classic and Enhanced values/bars aligned. */
.benchmark-panel{overflow:visible!important}
.benchmark-panel .bench-row{position:relative;align-items:center}
.bench-score-cell{min-width:0;display:flex;flex-direction:column;align-items:stretch}
.bench-status-slot{height:20px;display:flex;align-items:center;margin-bottom:5px}
.bench-score-cell .bench-score{display:block;line-height:1.25;font-variant-numeric:tabular-nums}
.bench-score-cell .bench-strip{margin-top:8px}
.benchmark-decision{display:inline-flex;align-items:center;justify-content:center;max-width:100%;padding:2px 6px;border:1px solid #a1adf037;border-radius:7px;background:#8997f018;color:#bfcafa;font:900 8px/1.15 'DM Sans',system-ui,sans-serif;letter-spacing:.025em;text-transform:uppercase;white-space:nowrap;text-align:center}
.benchmark-decision.good{background:#70efd114;border-color:#70efd13d;color:#8ff2d5}
.benchmark-decision.bad{background:#ff9c9414;border-color:#ff9c943d;color:#ffb4ac}
.benchmark-decision.review{background:#ffd38812;border-color:#ffd38840;color:#ffd997}
.benchmark-decision.unknown{opacity:.85}
@media(max-width:760px){
 .bench-status-slot{height:30px;margin-bottom:4px}
 .benchmark-decision{font-size:7px;line-height:1.2;letter-spacing:0;white-space:normal;padding:2px 4px;max-height:29px}
 .reason-accordion--benchmark{margin-top:6px}
}
@media(max-width:480px){
 .reason-accordion summary{padding:11px}
 .reason-toggle-status{display:none}
 .reason-toggle-right{font-size:9px}
}

<script>
/* Mode-aware NMHireXV2 API routes: run only the selected scoring engine(s). */
const CONFIG={API_BASE:location.protocol==='file:'?'http://localhost:8000':'',DEV_STAGE:'production',STAGE_NUMBER:''};
const getToken=()=>localStorage.getItem('token');
function logout(){localStorage.removeItem('token');render();}
const API={
 async _req(path,opts={}){
   const headers={...(opts.headers||{})};const token=getToken();if(token)headers.Authorization='Bearer '+token;
   let res;
   try{res=await fetch(CONFIG.API_BASE+path,{...opts,headers});}catch{throw new Error('Cannot reach the backend. Check that FastAPI is running.');}
   if(res.status===401){logout();throw new Error('Your session has expired. Please log in again.');}
   if(!res.ok){let msg=res.statusText;try{const j=await res.json();msg=j.detail||j.message||msg;}catch{}throw new Error(typeof msg==='string'?msg:JSON.stringify(msg));}
   return res.json();
 },
 async login(email,password){const r=await this._req('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({username:email,password})});localStorage.setItem('token',r.access_token);return r;},

   failures=0;
  }catch(e){
   if(/session has expired|log in again|screening run not found|access to this job/i.test(e.message||''))throw e;
   if(++failures>=6)throw new Error(`Could not retrieve screening progress after multiple attempts: ${e.message}`);
   S.status='Reconnecting';render();
   continue;
  }
  S.progress=p;
  const status=String(p.status||'').toUpperCase();
  S.status=status==='QUEUED'?'Queued':status==='RUNNING'?'Screening':status;
  render();
  if(status==='FAILED')throw new Error(p.error_message||'Background screening failed. Check your server logs.');
  if(status==='COMPLETED')return API.screenResults(jobId,runId);

 }

 else{content=`<div class="empty-art" aria-hidden="true"><div class="empty-circle"></div><div class="empty-doc"></div><div class="empty-doc"></div><div class="empty-doc"></div></div><div class="empty-inner"><div class="eyebrow">INDEPENDENT API</div><h4>Two inputs. One focused result.</h4><p>Paste or upload your JD and candidate JSON on the left, then run the shortlist. Only qualifying names and profile URLs will appear here.</p><div class="feature-chips"><span>Enhanced scoring</span><span>Score &gt; 75</span><span>Recommended / Review</span></div></div>`;}
 return `<section class="panel result-panel" id="integration-results"><div class="result-head"><div><div class="mini-label">RESULT / API RESPONSE</div><h3>Shortlisted candidates</h3></div><span class="mode-tag" style="color:#ffcc86;border-color:#ffcc8644;background:#ffcc8612">${ic('bolt',13)} BACKEND INTEGRATION</span></div>${content}<div style="padding:0 25px 22px"><div class="mini-label">REQUEST</div><div class="integration-endpoint">POST /api/screen-batch/shortlist</div><p class="integration-note">Form-data fields: <code>jd</code> and <code>candidates</code>. No Authorization header.</p></div></section>`;
}
function candidateSourceUI(busy){
 const jsonSelected=S.useJsonBatch;
 const check=S.jsonInputMethod==='paste'?validateCandidateJson(S.jsonText):null;
 const hint=S.jsonInputMethod==='upload'
  ?(S.jsonFile?`<span class="json-validation valid">${esc(S.jsonFile.name)} · Ready to screen</span>`:'<span class="json-validation">Choose a .json file containing {"candidates": [...]}.</span>')
  :`<div id="candidate-json-validation" class="json-validation ${S.jsonText.trim()?(check.ok?'valid':'invalid'):''}">${esc(S.jsonText.trim()?check.message:'Paste an object containing a candidates array.')}</div>`;
 return `<div class="candidate-source">
  <label class="input-label">Candidate source <span class="input-note">Enhanced screening</span></label>
  <p class="source-description">Choose where candidates come from for this screening run.</p>
  <div class="source-switch" role="group" aria-label="Candidate source">
   <button type="button" class="source-choice ${!jsonSelected?'active':''}" aria-pressed="${!jsonSelected}" onclick="setCandidateSource('database')" ${busy?'disabled':''}>${ic('users',14)} Database</button>
   <button type="button" class="source-choice ${jsonSelected?'active':''}" aria-pressed="${jsonSelected}" onclick="setCandidateSource('json')" ${busy?'disabled':''}>${ic('file',14)} Candidate JSON</button>
  </div>
  ${jsonSelected?`<div class="json-input-box">
   <label class="input-label">Provide your candidate JSON <span class="input-note">JSON only</span></label>
   <div class="json-methods" role="group" aria-label="How to provide candidate JSON">
    <button type="button" class="json-method ${S.jsonInputMethod==='paste'?'active':''}" aria-pressed="${S.jsonInputMethod==='paste'}" onclick="setJsonInputMethod('paste')" ${busy?'disabled':''}>Paste JSON</button>
    <button type="button" class="json-method ${S.jsonInputMethod==='upload'?'active':''}" aria-pressed="${S.jsonInputMethod==='upload'}" onclick="setJsonInputMethod('upload')" ${busy?'disabled':''}>Upload .json file</button>
   </div>
   ${S.jsonInputMethod==='paste'?`<textarea id="candidate-json" class="field json-editor" spellcheck="false" placeholder='{"candidates": [{"name": "Candidate A", "skills": ["Python"]}]}' oninput="onCandidateJsonText(this)" ${busy?'disabled':''}>${esc(S.jsonText)}</textarea>`:`<div class="upload json-upload" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropJsonFile(event)">
    <input type="file" accept=".json,application/json" aria-label="Upload candidate JSON file" onchange="onJsonFile(this)" ${busy?'disabled':''}/>
    <div class="upload-icon">${ic('upload',21)}</div>
    <div><div class="upload-title">${S.jsonFile?esc(S.jsonFile.name):'Drop your .json file or browse'}</div><div class="upload-sub">JSON files only · Maximum 10 MB</div></div>
   </div>`}
   ${hint}
   <p class="json-source-note">The batch endpoint runs Enhanced only and never inserts candidates into the database. Expected JSON format: <code>{&quot;candidates&quot;: [...]}</code>.</p>
  </div>`:`<p class="json-source-note">Default: the backend screens candidates from the database.</p>`}
 </div>`;
}
function intakePanel(){if(S.mode==='integration')return integrationIntake();const busy=S.analyzing||S.searching;return `<section class="panel" id="intake"><div class="panel-pad"><div class="panel-heading"><div><div class="mini-label">01 / JOB INTAKE</div><h3>Shape the search.</h3></div><span class="tiny-badge ${S.requirements?'':'neutral'}">${esc(S.status)}</span></div><label class="input-label" for="jt">Job title <span class="input-note">Optional reference</span></label><input id="jt" class="field" placeholder="e.g. Senior LLM Engineer" value="${esc(S.jobTitle)}" ${busy?'disabled':''} oninput="S.jobTitle=this.value" maxlength="160" />
 <label class="input-label">Job description <span class="input-note">Upload your file</span></label><div class="upload" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropFile(event)"><input type="file" accept=".pdf,.doc,.docx,.txt" aria-label="Upload job description" onchange="onFile(this)" ${busy?'disabled':''}/><div class="upload-icon">${ic('upload',23)}</div><div><div class="upload-title">${S.file?esc(S.file.name):'Drop a JD here or browse files'}</div><div class="upload-sub">PDF, DOC, DOCX or TXT · Maximum 10 MB</div></div></div>
 <div class="separator">OR PASTE THE DESCRIPTION</div><textarea id="jd" class="field" rows="6" placeholder="We're looking for someone who thrives on building useful AI systems..." ${busy?'disabled':''} oninput="onJdText(this)">${esc(S.jdText)}</textarea><div class="subaction-row" style="margin-top:4px"><span class="hint">Your criteria will appear on the right.</span><span id="wordcount" class="hint">${S.jdText.trim()?S.jdText.trim().split(/\s+/).length:0} words</span></div><div class="section-divider"></div>
 <button class="btn full ${S.analyzing?'secondary':'primary'}" onclick="analyze()" ${busy?'disabled':''}>${S.analyzing?ic('clock',17):ic('sparkles',17)} ${S.analyzing?'Extracting requirements…':S.requirements?'Re-analyze job description':'Analyze job description'} ${!S.analyzing?ic('arrow',16):''}</button>
 ${S.requirements?`<div class="parse-panel"><div class="parse-row"><div><strong>${ic('check',15)} Criteria extracted</strong><p>Review your search requirements before matching.</p></div><button class="btn small ghost" onclick="openJD()">Review ${ic('arrow',13)}</button></div></div>
 <div class="section-divider"></div>
 ${S.mode==='enhanced'?candidateSourceUI(busy):`<p class="engine-hint">${ic('info',15)} ${S.mode==='benchmark'?'Benchmark runs both engines on database candidates.':'Classic runs the deterministic engine only, on database candidates.'} Candidate JSON is supported in Enhanced mode only.</p>`}
 <button class="btn full secondary" onclick="screen()" ${busy||!S.jobId?'disabled':''}>${ic('bolt',18)} ${S.searching?'Screening…':activeScreenSource()==='json'?'Screen JSON candidates (Enhanced)':`Screen ${MODE[S.mode].title} · Database`} ${ic('arrow',16)}</button>`:''}
 ${(S.requirements||S.searchComplete)?`<button class="btn full ghost" style="margin-top:10px" ${busy?'disabled':''} onclick="resetSearch()">${ic('reset',15)} Start a new search</button>`:''}
 </div></section>`;}
function rightPanel(){if(S.mode==='integration')return integrationResults();const mode=MODE[S.mode];let main='';if(S.analyzing){main=processing('Analyzing your job description…','Identifying requirements, skills and experience signals.');}
 else if(S.searching){main=processing(`Running ${MODE[S.mode].title} screening…`,activeScreenSource()==='json'?'Enhanced engine is screening your JSON batch.':S.mode==='benchmark'?'Both Classic and Enhanced engines are scoring database candidates.':`Only the ${MODE[S.mode].title} engine is scoring database candidates.`,true);}
 else if(S.searchComplete){const d=statData();const val=S.mode==='enhanced'?d.enhancedStrong:d.classicStrong;main=`<div class="done-panel"><div class="done-icon">${ic('check',47)}</div><div class="eyebrow">SCREENING COMPLETE</div><h4>The shortlist is ready.</h4><p>${MODE[S.mode].title} screening completed. To evaluate another mode, select it and screen again.</p><div class="done-numbers"><div><b>${S.candidates.length}</b><small>Profiles returned</small></div><div><b class="mint">${S.mode==='enhanced'&&d.available.length===0?'—':val}</b><small>Matches ≥80</small></div><div><b>${S.took!=null?mmss(S.took):'—'}</b><small>Elapsed</small></div></div><button class="btn primary" onclick="topScroll('results')" ${!S.candidates.length?'disabled':''}>Explore candidates ${ic('arrow',16)}</button>${S.mode!=='classic'&&d.available.length===0&&S.candidates.length?'<div class="notice">Enhanced scores are missing from this run. Verify the Enhanced engine and try again.</div>':''}</div>`;}
 else if(S.requirements){const r=S.requirements;main=`<div class="criteria-tiles"><div class="criteria-tile"><small>ROLE TITLE</small><strong>${esc(r.job_title||S.jobTitle||'Not specified')}</strong></div><div class="criteria-tile"><small>EXPERIENCE</small><strong>${esc(fmtExp(r))}</strong></div><div class="criteria-tile"><small>WORK LOCATION</small><strong>${esc(r.location||'Not specified')}</strong></div><div class="criteria-tile"><small>WORK MODE</small><strong>${esc(r.work_mode||'Not specified')}</strong></div></div><div style="padding:0 26px 25px"><div class="mini-label" style="margin:0 0 12px">MANDATORY SKILLS</div>${chips(list(r.mandatory_skills))}<div class="load-cta"><button class="btn small ghost" onclick="openJD()">View all criteria ${ic('arrow',15)}</button></div></div>`;}
 else{main=`<div class="empty-art" aria-hidden="true"><div class="empty-circle"></div><div class="empty-doc"></div><div class="empty-doc"></div><div class="empty-doc"></div></div><div class="empty-inner"><div class="eyebrow">READY WHEN YOU ARE</div><h4>Clarity starts with a job description.</h4><p>Bring your role requirements to life. Once analyzed, this workspace becomes your command center for every candidate decision.</p><div class="feature-chips"><span>Skills intelligence</span><span>Transparent scoring</span><span>Better comparisons</span></div></div>`;}
 return `<section class="panel result-panel"><div class="result-head"><div><div class="mini-label">02 / MATCH INTELLIGENCE</div><h3>${S.requirements&&!S.searchComplete&&!S.analyzing&&!S.searching?'Your search blueprint':S.searchComplete?'Your matching overview':'Insights, in focus.'}</h3></div><span class="mode-tag" style="color:${mode.color};border-color:${mode.color}44;background:${mode.color}12">${ic(mode.icon,13)} ${mode.title.toUpperCase()} MODE</span></div>${main}</section>`;}
function processing(title,sub,screening=false){
 const p=screening?S.progress:null;
 const total=Math.max(0,num(p?.total_candidates)),done=Math.max(0,num(p?.processed_candidates));
 const pct=total>0?clamp(Math.round(done/total*100)):0;
 const stage=String(p?.current_stage||p?.status||'STARTING').replaceAll('_',' ');
 const remaining=Math.max(0,total-done);
 const progressUI=p?`<div class="live-progress"><div class="live-progress-label"><strong>${esc(stage)}</strong><span>${total?`${done.toLocaleString()} of ${total.toLocaleString()} processed · ${pct}%`:'Preparing candidate pool…'}</span></div><div class="live-progress-track" role="progressbar" aria-label="Screening progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><div class="live-progress-foot"><span>Completed: ${done.toLocaleString()}</span><span>Remaining: ${remaining.toLocaleString()}</span></div><div class="live-progress-foot" style="margin-top:6px"><span>Successful: ${num(p.successful_candidates).toLocaleString()}</span><span>Failed: ${num(p.failed_candidates).toLocaleString()}</span></div></div>`:'';
 return `<div class="processing"><div class="spin-blob">${ic(screening?'users':'sparkles',44)}</div><h4>${esc(title)}</h4><p>${esc(sub)}</p>${progressUI||'<div class="progress-line"></div>'}<div class="timer">${screening?`Elapsed · <span data-elapsed>${mmss(S.elapsed)}</span>`:'Reading and structuring your requirements'}</div></div>`;
}
function metric(label,value,note,color){return `<div class="metric" style="--accent:${color||'#85ebca'}"><small>${esc(label)}</small><strong class="accent">${esc(value)}</strong><span class="mini">${esc(note)}</span></div>`;}
function resultsMetrics(){const d=statData(),benchmark=S.mode==='benchmark',enhanced=S.mode==='enhanced';let cards=[];
 if(benchmark){const compared=d.both;const shifts=compared.filter(c=>rankFor(c,'score')!==rankFor(c,'enhanced_score')).length;cards=[metric('SCREENED',S.candidates.length,'Candidates in this run','#a1bcff'),metric('DUAL-SCORED',d.compared,'Available for comparison','#74eccb'),metric('CLASSIC AVERAGE',d.classicAvg==null?'—':d.classicAvg.toFixed(1),'Weighted score / 100','#97adff'),metric('ENHANCED AVERAGE',d.enhancedAvg==null?'—':d.enhancedAvg.toFixed(1),'Evidence-fit score / 100','#c2a3ff')];}
 else{const values=enhanced?d.available:S.candidates;const avg=enhanced?d.enhancedAvg:d.classicAvg;const high=enhanced?d.enhancedStrong:d.classicStrong;cards=[metric('SCREENED CANDIDATES',S.candidates.length,S.screenSource==='json'?'From candidate JSON':'From database','#a1bcff'),metric('SCORING COVERAGE',values.length,'With a '+(enhanced?'enhanced':'classic')+' score','#70e7c5'),metric('AVERAGE FIT',avg==null?'—':avg.toFixed(1),'Out of 100','#c3acff'),metric('STRONG MATCHES',high,'Scores at or above 80','#ffc98d')];}
 return `<div class="metrics">${cards.join('')}</div>`;}
function sortAndFilter(){let arr=[...S.candidates].filter(c=>!S.query||[c.name,c.email,c.current_role,c.current_company,c.location].some(x=>String(x||'').toLowerCase().includes(S.query.toLowerCase())));if(S.sort==='name')arr.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));else if(S.sort==='score')arr.sort((a,b)=>num(scoreFor(b,S.mode==='enhanced'?'enhanced':'classic'))-num(scoreFor(a,S.mode==='enhanced'?'enhanced':'classic')));else if(S.sort==='delta')arr.sort((a,b)=>Math.abs(num(b.enhanced_score)-num(b.score))-Math.abs(num(a.enhanced_score)-num(a.score)));return arr;}
function benchmarkTable(items){
 const usable=items.filter(c=>safeNumber(c.score)!==null&&enhancedAvailable(c));
 return `<div class="benchmark-info">
  <div><strong>${ic('chart',18)} Two engines. One objective.</strong><p>Classic and Enhanced are compared on the <b>same screened candidates</b>. Scores use different methodologies; differences are not an accuracy verdict.</p></div>
  <span class="tiny-badge">${usable.length}/${items.length} comparable</span>
 </div>
 <div class="panel benchmark-panel">
  <div class="bench-head"><span>Candidate</span><span>Classic</span><span>Enhanced</span><span>Difference</span><span>Details</span></div>
  ${items.map(c=>{
    const i=S.candidates.indexOf(c);
    const a=safeNumber(c.score),b=safeNumber(c.enhanced_score);
    const delta=a==null||b==null?null:b-a;
    const status=enhancedStatus(c);
    const reasonDetails=reasoningAccordion(c,'benchmark');
    return `<div class="bench-row">
      <div><strong>${esc(c.name||'Unnamed candidate')}</strong><small>${esc(c.current_role||c.location||'Candidate')} · ${a!=null?'Classic #'+rankFor(c,'score'):'Classic unavailable'}${b!=null?' / Enhanced #'+rankFor(c,'enhanced_score'):''}</small></div>
      <div class="bench-score-cell">
        <div class="bench-status-slot" aria-hidden="true"></div>
        <span class="bench-score">${a==null?'—':a.toFixed(1)}</span>
        <div class="bench-strip classic"><i style="width:${clamp(a||0)}%"></i></div>
      </div>
      <div class="bench-score-cell">
        <div class="bench-status-slot"><span class="benchmark-decision ${b==null?'unknown':status.kind}">${b==null?'NOT AVAILABLE':esc(status.text)}</span></div>
        <span class="bench-score">${b==null?'—':b.toFixed(1)}</span>
        <div class="bench-strip"><i style="width:${clamp(b||0)}%"></i></div>
      </div>
      <div><span class="delta ${delta==null?'neutral':delta>0?'pos':delta<0?'neg':'neutral'}">${delta==null?'N/A':`${delta>0?'+':''}${delta.toFixed(1)}`}</span></div>
      <button class="btn small ghost" onclick="openProfile(${i})" aria-label="View ${esc(c.name||'candidate')} profile">${ic('arrow',15)}</button>
      ${reasonDetails}
    </div>`;
  }).join('')}
 </div>
 <p class="footnote">Rank numbers are calculated from the screened list for each engine. Expand “Why this status?” to view the reasons returned by the backend. Missing Enhanced scores are not estimated.</p>`;
}
function results(){if(S.mode==='integration'||!S.searchComplete)return '';const d=statData(),items=sortAndFilter(),visible=items.slice(0,S.visibleCount);return `<section class="analytics" id="results"><div class="section-header"><div><div class="kicker">03 / THE SHORTLIST</div><h2>${S.mode==='benchmark'?'Head-to-head intelligence.':S.mode==='enhanced'?'Deeper signals. Sharper fit.':'Your ranked talent shortlist.'}</h2></div><p>${esc(S.jobTitle||'Current screening')} · ${S.candidates.length} candidate${S.candidates.length===1?'':'s'} <span class="source-indicator">${S.screenSource==='json'?'· JSON batch':'· Database'}</span></p></div>${resultsMetrics()}
 ${S.mode!=='classic'&&d.available.length===0&&S.candidates.length?`<div class="notice" style="margin-bottom:18px">No Enhanced scores were returned by this screening run. Check Enhanced scoring logs, then try again.</div>`:''}
 <div class="results-toolbar"><div class="inline"><div class="kicker">${S.mode==='benchmark'?'BENCHMARK COMPARISON':'CANDIDATE PROFILES'}</div><span class="tiny-badge neutral">${items.length} shown</span></div><div class="filter-controls"><label class="search-box">${ic('search',15)}<input aria-label="Search candidates" id="csearch" placeholder="Search name, role, city…" value="${esc(S.query)}" oninput="S.query=this.value;updateResults()"/></label><select class="select" aria-label="Sort candidates" onchange="S.sort=this.value;updateResults()"><option value="score" ${S.sort==='score'?'selected':''}>Sort: Top score</option><option value="name" ${S.sort==='name'?'selected':''}>Sort: Name</option>${S.mode==='benchmark'?`<option value="delta" ${S.sort==='delta'?'selected':''}>Sort: Biggest difference</option>`:''}</select></div></div>
 <div id="result-content">${visible.length?(S.mode==='benchmark'?benchmarkTable(visible):`<div class="cand-grid">${visible.map(candidateCard).join('')}</div>`):`<div class="empty-list">No candidates match your search.</div>`}</div>
 <div class="load-cta" id="load-more-results">${items.length>S.visibleCount?`<button class="btn secondary" onclick="loadMore()">Load 50 more (${visible.length} of ${items.length} shown) ${ic('arrow',15)}</button>`:''}</div>
 <div class="load-cta" style="margin-top:20px"><button class="btn ghost" onclick="resetSearch()">${ic('reset',15)} New search</button>${S.candidates.length?`<span class="hint">Review profiles before contacting candidates. WhatsApp invites require confirmation.</span>`:''}</div></section>`;}
function updateResults(){
 const target=document.getElementById('result-content');if(!target)return;
 const items=sortAndFilter(),visible=items.slice(0,S.visibleCount);
 target.innerHTML=visible.length?(S.mode==='benchmark'?benchmarkTable(visible):`<div class="cand-grid">${visible.map(candidateCard).join('')}</div>`):'<div class="empty-list">No candidates match your search.</div>';
 const more=document.getElementById('load-more-results');
 if(more)more.innerHTML=items.length>S.visibleCount?`<button class="btn secondary" onclick="loadMore()">Load 50 more (${visible.length} of ${items.length} shown) ${ic('arrow',15)}</button>`:'';
}
function loadMore(){S.visibleCount+=50;updateResults();}
function renderLogin(){return `<div class="shell">${nav()}<main class="main">${hero()}<section style="max-width:465px;margin:55px auto" class="panel"><div class="panel-pad"><div class="eyebrow">SECURE RECRUITER ACCESS</div><h2 style="font:800 28px Manrope;letter-spacing:-.04em">Welcome back.</h2><p class="muted" style="margin-bottom:28px">Sign in to open your talent intelligence workspace.</p>${S.error?`<div class="error">${esc(S.error)}</div>`:''}<form onsubmit="event.preventDefault();doLogin()"><label for="email" class="input-label">Work email</label><input id="email" type="email" class="field" placeholder="you@company.com" required autocomplete="username"/><label class="input-label" for="password">Password</label><input id="password" class="field" type="password" required autocomplete="current-password" placeholder="Enter your password"/><button type="submit" class="btn primary full" style="margin-top:24px">Enter Match Studio ${ic('arrow',16)}</button></form><div class="section-divider"></div><p class="muted" style="font-size:12px;line-height:1.6">Want to test the API without a Job ID or bearer token?</p><button class="btn secondary full" onclick="modeSet('integration')">${ic('bolt',17)} Open Backend Integration ${ic('arrow',16)}</button></div></section></main></div>`;}
async function doLogin(){const email=document.getElementById('email')?.value?.trim()||'',pass=document.getElementById('password')?.value||'';if(!email||!pass)return;try{await API.login(email,pass);S.error='';render();}catch(e){S.error=e.message||'Login failed';render();}}
function render(){const a=document.getElementById('app');if(!getToken()&&S.mode!=='integration'){a.innerHTML=renderLogin();return;}const el=document.activeElement;const focus=el?.id,position=el&&typeof el.selectionStart==='number'?el.selectionStart:null;a.innerHTML=`<div class="shell">${nav()}<main class="main">${hero()}${steps()}${modes()}${S.error?`<div class="error" role="alert">${esc(S.error)}</div>`:''}<div class="workspace">${intakePanel()}${rightPanel()}</div>${results()}<footer class="footer"><div><strong>NMHireXV2</strong> / Match Studio <span style="color:#70819d">· From requirements to real potential.</span></div><div>Classic <span style="color:var(--mint)">•</span> Enhanced <span style="color:var(--mint)">•</span> Benchmark <span style="color:var(--mint)">•</span> Backend Integration</div></footer></main></div>`;if(focus&&position!=null){const target=document.getElementById(focus);if(target&&!target.disabled){target.focus();try{target.setSelectionRange(position,position);}catch{}}}}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
render();
const qp=new URLSearchParams(location.search);if(qp.has('mode')&&MODE[qp.get('mode')]){S.mode=qp.get('mode');render();}
if(qp.get('jobId')){S.jobId=qp.get('jobId');if(qp.get('screened')==='1')loadExisting(S.jobId);else screen(S.jobId);}
</script>
